<section class="form">
  <h2>Sök kurs</h2>
  <!-- ReactiveFormsModule skapar ett formulär, som styrs från finder-form.ts-filen -->
  <form class="finder" [formGroup]="form">
    <label for="search">Mata in kurskod eller kursnamn</label>
    <input id="search" type="text" formControlName="search" placeholder="DT207">
  </form>
</section>
